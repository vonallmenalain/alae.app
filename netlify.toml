# Netlify-Konfiguration für alae.app
#
# Diese Datei hat Vorrang vor den Einstellungen in der Netlify-Oberfläche.
# Damit ist das Deployment reproduzierbar, auch wenn das Projekt später neu
# verbunden wird.

[build]
  # Statische Seite, es gibt nichts zu bauen.
  publish = "."
  functions = "netlify/functions"

# Rechtsseiten auch ohne Dateiendung erreichbar
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

# Kurze, sprechende Adresse für das Kontaktformular
[[redirects]]
  from = "/api/kontakt"
  to = "/.netlify/functions/kontakt"
  status = 200

# Quelltext der Funktion nicht als statische Datei ausliefern
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
